version: "3.8"

services:
  apache:
    build: .
    container_name: apache
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - mariadb
    environment:
      DB_HOST: mariadb
      DB_USER: dbuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: dbname

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    ports:
      - "3306:3306"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: dbname
      MARIADB_USER: dbuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
